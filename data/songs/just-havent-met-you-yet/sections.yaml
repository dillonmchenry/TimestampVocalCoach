# Section labels for "Haven't Met You Yet" by Michael Bublé.
#
# Times are song-time seconds from the UltraStar chart (BPM=245.1, GAP=17085ms,
# sec/beat = 60/(245.1*4) ≈ 0.0612). Each boundary is the start of the first
# lyric of that section (or the previous section's last lyric when an
# instrumental gap follows). Genius.com labels, with repeats numbered for the
# UI. The "You might also like" ads in the Genius paste are ignored.
#
# GAP was moved from the SingStar original 17770 → 17085 so on-screen lyrics
# match the reference vocal (calibrated by running the reference through
# SecondPass; median arrival was +85ms behind the 17000ms GAP).
#
# Schema:
#   sections:
#     - name: str
#       start_s: float
#       end_s: float
#       kind: optional[str]  # intro|verse|pre_chorus|chorus|bridge|refrain|outro
#
# Present at load time this OVERRIDES the auto "Phrase N" sections
# (vocal_coach/reference.py); no re-import required.

